<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Name Maker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@300;400;500;700&display=swap');
body {
    font-family: 'Roboto', sans-serif;
    background-color: #000;
    color: #fff;
}
.header-title {
    font-family: 'Pacifico', cursive;
    font-size: 2.5rem;
    text-align: center;
    margin-bottom: 0.5rem;
    color: #ff69b4;
}
.snap-btn {
    display: block;
    width: 220px;
    margin: 0 auto 2rem auto;
    text-align: center;
    background: linear-gradient(90deg, #fffc00, #ff00ff);
    color: #000;
    font-weight: bold;
    padding: 0.7rem 1rem;
    border-radius: 12px;
    text-decoration: none;
    transition: transform 0.2s ease;
}
.snap-btn:hover {
    transform: scale(1.05);
}
textarea {
    width: 100%;
    padding: 1rem;
    border-radius: 12px;
    border: none;
    font-size: 1.2rem;
    margin-bottom: 2rem;
}
.font-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 1rem;
    margin-bottom: 0.5rem;
    border-radius: 8px;
    background: #111;
    transition: background 0.2s;
}
.font-item:hover {
    background: #222;
}
.copy-btn {
    background: #ff69b4;
    color: #000;
    font-weight: bold;
    border: none;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
}
.copy-btn:hover {
    background: #ff1493;
}
</style>
</head>
<body class="min-h-screen px-4 py-8">

<!-- Başlık -->
<h1 class="header-title">🖋️🎊 بو گهورینا نافان ب جوانترین شێواز</h1>

<!-- Snapchat Butonu -->
<a href="https://www.snapchat.com/add/k4miran.sndi?share_id=az_iUCJeD3I&locale=tr-TR" target="_blank" class="snap-btn">Add me on Snapchat 👻</a>

<!-- Giriş -->
<textarea id="nameInput" placeholder="نافێ خو ل فێرێ بنفیسە"></textarea>

<!-- Fontlar -->
<div id="fontsList"></div>

<script>
feather.replace();

const styles = [
"𝓚𝓪𝓶𝓲𝓻𝓪𝓷",
"𝕂𝖆𝖒𝖎𝖗𝖆𝖓",
"♕✎  𝓀ᗩ𝓂Ɨ𝔯𝓪Ν  ✎🐤",
"𝒦𝒶𝓂𝒾𝓇𝒶𝓃",
"Ｋａｍｉｒａｎ",
"ᛕꪖꪑ꠸᥅ꪖꪀ",
"ƙׁׅ֑ɑׁׅ֮ ꩇׁׅ݊ꪱׁׅꭈׁׅɑׁׅ֮ꪀׁׅ",
"ᴋᴀᴍɪʀᴀɴ",
"uɐɹıɯɐ⋊",
"K⃣ a⃣ m⃣ i⃣ r⃣ a⃣ n⃣",
"🇰🇦🇲🇮🇷🇦🇳",
"🄺🄰🄼🄸🅁🄰🄽",
"ᴎɒɿimɒ⋊",
"ₖₐₘᵢᵣₐₙ",
"ᴷᵃᵐⁱʳᵃⁿ",
"Ⓚⓐⓜⓘⓡⓐⓝ",
"кค๓เгคภ",
"Kαɱιɾaη",
"ӄǟʍɨʀǟռ",
"ᏦᏗᎷᎥᏒᏗᏁ",
"𝐊𝐚𝐦𝐢𝐫𝐚𝐧",
"𝗞𝗮𝗺𝗶𝗿𝗮𝗻",
"𝙆𝙖𝙢𝙞𝙧𝙖𝙣",
"KΛMIЯΛП",
"Kåmïråñ",
"₭₳₥łⱤ₳₦",
"【K】【a】【m】【i】【r】【a】【n】",
"『K』『a』『m』『i』『r』『a』『n』",
"░K░a░m░i░r░a░n░",
"(っ◔◡◔)っ ♥ Kamiran ♥",
"★·.·´¯`·.·★   🎀  𝒦𝒶𝓂𝒾𝓇𝒶𝓃  🎀   ★·.·`¯´··★"
];

const fontsList = document.getElementById('fontsList');
const input = document.getElementById('nameInput');

function renderFonts() {
    fontsList.innerHTML = '';
    styles.forEach(style => {
        const div = document.createElement('div');
        div.className = 'font-item';
        const span = document.createElement('span');
        span.textContent = transformText(style, input.value);
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = () => {
            navigator.clipboard.writeText(span.textContent);
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 1000);
        };
        div.appendChild(span);
        div.appendChild(btn);
        fontsList.appendChild(div);
    });
}

function transformText(style, name) {
    if(!name) return style;
    let result = '';
    for(let i=0;i<name.length;i++){
        const c = name[i];
        if(style[i]) result += style[i];
        else result += c;
    }
    return result;
}

input.addEventListener('input', renderFonts);
renderFonts();
</script>

</body>
</html>
