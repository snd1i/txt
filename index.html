<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fancy Name Maker — Kamiran</title>

<!-- Tailwind CDN for quick styling -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>

<style>
  :root{
    --accent: #ff4da6;
    --muted: #9ca3af;
    --panel: #0f0f10;
    --panel-2: #121214;
  }
  html,body{
    height:100%;
    background:#000;
    color:#fff;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  .container{max-width:980px;margin:32px auto;padding:20px;}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); border-radius:12px; padding:18px;}
  .title {font-weight:700; font-size:20px; display:flex; align-items:center; gap:12px; justify-content:center;}
  .subtitle {color:var(--muted); text-align:center; margin-top:6px; font-size:14px;}
  textarea{
    width:100%; min-height:70px; resize:vertical;
    background:var(--panel); color:#fff; border-radius:10px; border:1px solid rgba(255,255,255,0.03);
    padding:14px; font-size:16px; outline:none;
  }
  textarea::placeholder{color:#6b7280;}
  .preview {margin-top:18px; max-height:56vh; overflow:auto; padding-right:6px;}
  .line {
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; background:var(--panel-2); border-radius:10px; padding:10px 12px; margin-bottom:10px;
    transition:transform .12s ease, background .12s ease;
    border:1px solid rgba(255,255,255,0.02);
  }
  .line:hover{transform:translateY(-4px); background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));}
  .line .text{font-size:18px; word-break:break-word; flex:1; padding-right:10px;}
  .badge{font-size:12px; color:var(--muted); padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,0.03); background:transparent;}
  .copy-btn{background:var(--accent); color:#fff; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; font-weight:600;}
  .copy-btn:active{transform:scale(.98);}
  .snap-btn{
    display:inline-flex; gap:8px; align-items:center; background:linear-gradient(90deg,#ff6aa6,#ff4da6);
    color:#fff; padding:10px 14px; border-radius:10px; font-weight:700; text-decoration:none;
    box-shadow:0 6px 20px rgba(255,77,166,0.12); border:1px solid rgba(255,77,166,0.12);
  }
  .meta-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px;}
  @media (max-width:640px){
    .title{font-size:18px;}
    .line .text{font-size:16px;}
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="title">
        <span style="font-size:24px">🖋️🎊</span>
        <div style="line-height:1;">
          <div style="font-weight:800; font-size:20px; text-align:center;">🖋️🎊 بو گهورینا نافان ب جوانترین شێواز</div>
        </div>
      </div>
      <div class="subtitle">نافێ خو ل فێرێ بنفیسە — نامت را اینجا بنویس و فوراً با استایل‌های شیک ببین</div>

      <div style="margin-top:16px;">
        <textarea id="inputText" placeholder="نافێ خو ل فێرێ بنفیسە"></textarea>
      </div>

        <div style="display:flex; gap:8px; align-items:center;">
          <span class="badge">30+ fancy unicode styles</span>
          <span class="badge">Real unicode output (works on Instagram / Telegram / bio)</span>
        </div>

        <a id="snapLink" class="snap-btn" href="https://www.snapchat.com/add/k4miran.sndi?share_id=az_iUCJeD3I&locale=tr-TR" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.88 13.36c.04.33.06.67.06 1.02 0 5.52-4.48 10-10 10S1 19.9 1 14.38C1 8.86 5.48 4.38 11 4.38c.35 0 .69.02 1.02.06l.84.13.13-.84C13.41 2.72 14.67 2 16.06 2 19.87 2 23 5.13 23 8.94c0 1.39-.72 2.65-1.92 3.42l-.2.13z"></path></svg>
          add me on Snapchat 👻
        </a>
      </div>

      <div id="preview" class="preview" aria-live="polite" aria-atomic="true" style="margin-top:14px;"></div>

      <div style="margin-top:8px; display:flex; gap:10px; justify-content:flex-end;">
        <button id="copyAll" title="Copy all styles (newline separated)" class="copy-btn">Copy All</button>
        <button id="resetBtn" class="badge">Reset</button>
      </div>
    </div>
  </div>

<script>
feather.replace();

// ---------- STYLE TRANSFORMERS ----------
// We'll provide many real-unicode style transformations.
// Each style object: {name: "...", fn: (text) => transformedText}
//
// Note: For letters outside the mapping (punctuation, spaces, emojis) we keep original char.

function makeMap(fromStr, toStr){
  const map = {};
  for(let i=0;i<fromStr.length;i++) map[fromStr[i]] = toStr[i];
  return map;
}

// Basic alphabet (upper + lower)
const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lower = "abcdefghijklmnopqrstuvwxyz";
const digits = "0123456789";

// Various mapping tables (some borrowed from standard unicode math alphabets)
const boldMap = makeMap(upper + lower + digits,
  "𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙" +
  "𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳" +
  "𝟎𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖𝟗");

const italicMap = makeMap(upper + lower,
  "𝐴𝐵𝐶𝐷𝐸𝐹𝐺𝐻𝐼𝐽𝐾𝐿𝑀𝑁𝑂𝑃𝑄𝑅𝑆𝑇𝑈𝑉𝑊𝑋𝑌𝑍" +
  "𝑎𝑏𝑐𝑑𝑒𝑓𝑔ℎ𝑖𝑗𝑘𝑙𝑚𝑛𝑜𝑝𝑞𝑟𝑠𝑡𝑢𝑣𝑤𝑥𝑦𝑧");

const boldItalicMap = makeMap(upper + lower,
  "𝑨𝑩𝑪𝑫𝑬𝑭𝑮𝑯𝑰𝑱𝑲𝑳𝑴𝑵𝑶𝑷𝑸𝑹𝑺𝑻𝑼𝑽𝑾𝑿𝒀𝒁" +
  "𝒂𝒃𝒄𝒅𝒆𝒇𝒈𝒉𝒊𝒋𝒌𝒍𝒎𝒏𝒐𝒑𝒒𝒓𝒔𝒕𝒖𝒗𝒘𝒙𝒚𝒛");

const scriptMap = makeMap(upper + lower,
  "𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒥𝒦ℒℳ𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵" +
  "𝒶𝒷𝒸𝒹ℯ𝒻𝑔𝒽𝒾𝒿𝓀𝓁𝓂𝓃ℴ𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏");

const boldScriptMap = makeMap(upper + lower,
  "𝓐𝓑𝓒𝓓𝓔𝓕𝓖𝓗𝓘𝓙𝓚𝓛𝓜𝓝𝓞𝓟𝓠𝓡𝓢𝓣𝓤𝓥𝓦𝓧𝓨𝓩" +
  "𝓪𝓫𝓬𝓭𝓮𝓯𝓰𝓱𝓲𝓳𝓴𝓵𝓶𝓷𝓸𝓹𝓺𝓻𝓼𝓽𝓾𝓿𝔀𝔁𝔂𝔃");

const frakturMap = makeMap(upper + lower,
  "𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌ𝔑𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜𝔝" +
  "𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷");

const doubleMap = makeMap(upper + lower + digits,
  "𝔸𝔹ℂ𝔻𝔼𝔽𝔾ℍ𝕀𝕁𝕂𝕃𝕄𝕄𝕆𝔓𝔔ℝ𝕊𝕋𝕌𝕍𝕎𝕏𝕐ℤ" +
  "𝕒𝕓𝕔𝕕𝕖𝕗𝕘𝕙𝕚𝕛𝕜𝕝𝕞𝕟𝕠𝕡𝕢𝕣𝕤𝕥𝕦𝕧𝕨𝕩𝕪𝕫" +
  "𝟘𝟙𝟚𝟛𝟜𝟝𝟞𝟟𝟠𝟡");

const monoMap = makeMap(upper + lower + digits,
  "𝙰𝙱𝙲𝙳𝙴𝙵𝙶𝙷𝙸𝙹𝙺𝙻𝙼𝙽𝙾𝙿𝚀𝚁𝚂𝚃𝚄𝚅𝚆𝚇𝚈𝚉" +
  "𝚊𝚋𝚌𝚍𝚎𝚏𝚐𝚑𝚒𝚓𝚔𝚕𝚖𝚗𝚘𝚙𝚚𝚛𝚜𝚝𝚞𝚟𝚠𝚡𝚢𝚣" +
  "𝟶𝟷𝟸𝟹𝟺𝟻𝟼𝟽𝟾𝟿");

const fullwidthMap = makeMap(upper + lower + digits,
  "ＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵＶＷＸＹＺ" +
  "ａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ" +
  "０１２３４５６７８９");

const circledUpperMap = (function(){
  const map= {};
  for(let i=0;i<26;i++){ map[ upper[i] ] = String.fromCharCode(0x24B6 + i); }
  for(let i=0;i<26;i++){ map[ lower[i] ] = String.fromCharCode(0x24D0 + i); }
  return map;
})();

const boxedMap = (function(){
  const map = {};
  const boxed = [
    '🄰','🄱','🄲','🄳','🄴','🄵','🄶','🄷','🄸','🄹','🄺','🄻','🄼','🄽','🄾','🄿','🅀','🅁','🅂','🅃','🅄','🅅','🅆','🅇','🅈','🅉'
  ];
  for(let i=0;i<26;i++){ map[upper[i]] = boxed[i]; map[lower[i]] = boxed[i]; }
  return map;
})();

const bubbleMap = makeMap(upper + lower,
  "ⒶⒷⒸⒹⒺⒻⒼⒽⒾⒿⓀⓁⓂⓃⓄⓅⓆⓇⓈⓉⓊⓋⓌⓍⓎⓏ" +
  "ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛⓜⓝⓞⓟⓠⓡⓢⓣⓤⓥⓦⓧⓨⓩ");

const squaredMap = (function(){
  const map = {};
  const base = ['🄰','🄱','🄲','🄳','🄴','🄵','🄶','🄷','🄸','🄹','🄺','🄻','🄼','🄽','🄾','🄿','🅀','🅁','🅂','🅃','🅄','🅅','🅆','🅇','🅈','🅉'];
  for(let i=0;i<26;i++){ map[upper[i]] = base[i]; map[lower[i]] = base[i]; }
  return map;
})();

// small-caps approximate mapping for lowercase -> smallcaps
const smallCapsMap = makeMap(lower,
  "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ");

// tiny superscript (partial)
const supersMap = makeMap("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
  "ᵃᵇᶜᵈᵉᶠᵍʰᶦʲᵏˡᵐⁿᵒᵖᵠʳˢᵗᵘᵛʷˣʸᶻᴬᴮᶜᴰᴱᴱᶠᴳᴴᴵᴶᴷᴸᴹᴺᴼᴾᵠᴿˢᵀᵁᵛᵂˣʸᶻ⁰¹²³⁴⁵⁶⁷⁸⁹");

// subscript (partial)
const subMap = makeMap("abcdefghijklmnopqrstuvwxyz0123456789",
  "ₐₑcᵭₑf₉ₕᵢⱼₖₗₘₙₒₚqᵣₛₜᵤᵥwₓyᵣ₀₁₂₃₄₅₆₇₈₉");

// combining "zalgo" diacritics generator
const zalgoUp = ['\u030d','\u030e','\u0304','\u0305','\u033f','\u0311','\u0306','\u0310','\u0352','\u0357','\u0351','\u0307','\u0308','\u030a','\u0342','\u0343','\u0344','\u034a','\u034b','\u034c','\u0303','\u0302','\u030c','\u0350','\u0300','\u0301','\u030b','\u030f','\u0312','\u0313','\u0314','\u033d','\u0309','\u0363','\u0364','\u0365','\u0366'];
const zalgoDown = ['\u0316','\u0317','\u0318','\u0319','\u031c','\u031d','\u031e','\u031f','\u0320','\u0324','\u0325','\u0326','\u0329','\u032a','\u032b','\u032c','\u032d','\u032e','\u032f','\u0330','\u0331','\u0332','\u0333','\u0339','\u033a'];
const zalgoMid = ['\u0315','\u031b','\u0340','\u0341','\u0358','\u0321','\u0322','\u0327','\u0328','\u0334','\u0335','\u0336','\u034f','\u035c','\u035d','\u035e'];

function zalgoize(s){
  // moderate intensity
  let out = '';
  for(const ch of s){
    out += ch;
    // skip spaces
    if(/\s/.test(ch)) continue;
    // add few combining chars
    const up = zalgoUp[Math.floor(Math.random()*zalgoUp.length)];
    const mid = zalgoMid[Math.floor(Math.random()*zalgoMid.length)];
    const down = zalgoDown[Math.floor(Math.random()*zalgoDown.length)];
    out += up + mid + down;
  }
  return out;
}

// upside-down map (partial)
const upsideMap = makeMap("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
  "ɐqɔpǝɟƃɥᴉɾʞlɯuodbɹsʇnʌʍxʎz∀qƆpƎℲפHIſʞ˥WNOԀQɹS┴∩ΛWMX⅄Z0ƖᄅƐㄣϛ9ㄥ86");

function flipText(s){
  // simple approach: reverse and map where possible
  return s.split('').reverse().map(ch => upsideMap[ch] || ch).join('');
}

// bracketed style (each char enclosed with spaced style)
function enclosedBoxes(s){
  const base = s.split('');
  return base.map(c => `【${c}】`).join(' ');
}

// spacing + dot decoration
function spacedDots(s){
  return s.split('').join(' · ');
}

// regional indicator -> big squared letters "K⃣" style using emoji numbers? use combining enclosed keycap for numbers isn't useful for letters
function keycapBlock(s){
  // create separated circled letters with combining enclosing keycap if possible (fallback to boxed)
  return s.split('').map(ch => (/[A-Za-z0-9]/.test(ch) ? ch + '\u20E3' : ch)).join(' ');
}

// decorate with emoji prefix/suffix (from examples)
function emojiFrame(s){
  return `🎀  ${s}  🎀`;
}

// create spaced boxed with circles around each char (use circled map)
function circledStyle(s){
  return s.split('').map(ch=>{
    if(/[A-Za-z]/.test(ch)){
      const isUpper = /[A-Z]/.test(ch);
      const idx = (isUpper ? upper.indexOf(ch) : lower.indexOf(ch.toLowerCase()));
      if(idx>=0){
        return String.fromCharCode(isUpper ? 0x24B6 + idx : 0x24D0 + idx);
      }
    }
    return ch;
  }).join('');
}

// big squares using Enclosed Alphanumerics for uppercase via codepoints U+1F130 etc (fallback)
function enclosedSquares(s){
  return s.split('').map(ch=>{
    if(/[A-Za-z]/.test(ch)){
      const isUpper = /[A-Z]/.test(ch);
      const idx = (isUpper ? upper.indexOf(ch) : lower.indexOf(ch.toUpperCase()));
      // fallback: use square parenthesis style
      return `【${ch}】`;
    }
    return ch;
  }).join('');
}

// small utility replacer
function applyMap(text, map){
  return text.split('').map(ch => map[ch] || map[ch] || ch).join('');
}

// combine some transformations to create many distinct styles
const styleGenerators = [
  {name:'𝐁𝐨𝐥𝐝', fn: t => applyMap(t, boldMap)},
  {name:'𝑰𝒕𝒂𝒍𝒊𝒄', fn: t => applyMap(t, italicMap)},
  {name:'𝑩𝒐𝒍𝒅-𝑰𝒕𝒂𝒍𝒊𝒄', fn: t => applyMap(t, boldItalicMap)},
  {name:'𝒮𝒄𝓇𝒾𝓅𝓉', fn: t => applyMap(t, scriptMap)},
  {name:'𝓑𝓸𝓵𝓭-𝓢𝓬𝓻𝓲𝓹𝓽', fn: t => applyMap(t, boldScriptMap)},
  {name:'𝔉𝔯𝔞𝔨𝔱𝔲𝔯', fn: t => applyMap(t, frakturMap)},
  {name:'𝕯𝖔𝖚𝖇𝖑𝖊', fn: t => applyMap(t, doubleMap)},
  {name:'𝚖𝚘𝚗𝚘𝚜𝚙𝚊𝚌𝚎', fn: t => applyMap(t, monoMap)},
  {name:'ＦＵＬＬＷＩＤＴＨ', fn: t => applyMap(t, fullwidthMap)},
  {name:'ⒸⒾⓇⒸⓁⒺⒹ', fn: t => applyMap(t, circledUpperMap)},
  {name:'🄱🅾🅇🄴🄳', fn: t => applyMap(t, boxedMap)},
  {name:'ⒷⓤⒷⒷⓁⒺ', fn: t => applyMap(t, bubbleMap)},
  {name:'sᴍᴀʟʟ ᴄᴀᴘs', fn: t => applyMap(t, smallCapsMap)},
  {name:'ˢᵘᵖᵉʳˢᶜʳᶦᵖᵗ', fn: t => applyMap(t, supersMap)},
  {name:'ₛᵤ𝑏ₛ𝚌ʳᶦᵖᵗ', fn: t => applyMap(t, subMap)},
  {name:'Z̷a̷l̷g̷o̷', fn: t => zalgoize(t)},
  {name:'ɐqɯoɹʇ (flip)', fn: t => flipText(t)},
  {name:'【Ｂｏｘｅｄ】', fn: t => enclosedBoxes(t)},
  {name:'·  S p a c e d  ·', fn: t => spacedDots(t)},
  {name:'🎀 Framed 🎀', fn: t => emojiFrame(t)},
  {name:'ⒸⒾⓇⓒⓁ⒆Ⓓ (alt)', fn: t => circledStyle(t)},
  {name:'【SQUARED】', fn: t => enclosedSquares(t)},
  {name:'K⃣-style', fn: t => keycapBlock(t)},
  {name:'ᵏᵃᵐɪʀᴀɴ (small fancy)', fn: t => t.split('').map(ch=> (/[A-Za-z]/.test(ch)? ch.toLowerCase() : ch)).join('') },
  {name:'𝙺𝚊𝚖𝚒𝚛𝚊𝚗 (boxed monospace)', fn: t => applyMap(t, monoMap)},
  {name:'𝘒𝘢𝘮𝘪𝘳𝘢𝘯 (italic monospace)', fn: t => applyMap(t, italicMap)},
  {name:'𝔎𝔞𝔪𝔦𝔯𝔞𝔫 (fraktur alt)', fn: t => applyMap(t, frakturMap)},
  {name:'K̶a̶m̶i̶r̶a̶n̶ (strike decor)', fn: t => t.split('').map(c=> c + '\u0336').join('')},
  {name:'K̴a̴m̴i̴r̴a̴n̴ (glitch)', fn: t => t.split('').map(c=> c + '\u0334').join('')},
  {name:'K̲a̲m̲i̲r̲a̲n̲ (underlinecomb)', fn: t => t.split('').map(c=> c + '\u0332').join('')},
  {name:'⒦⒜⒨⒧⒭⒜⒩ (decor box)', fn: t => applyMap(t, boxedMap)}
];

// Utility: transform using mapping or leave char as-is
function transformWithMap(text, map){
  return text.split('').map(ch => (map[ch] !== undefined ? map[ch] : (map[ch] || ch))).join('');
}

// Main behavior
const input = document.getElementById('inputText');
const preview = document.getElementById('preview');
const copyAllBtn = document.getElementById('copyAll');
const resetBtn = document.getElementById('resetBtn');

function renderAll(){
  const raw = input.value || '';
  preview.innerHTML = '';
  if(!raw.trim()) return;

  // iterate through styleGenerators in order
  styleGenerators.forEach(style => {
    try {
      const transformed = typeof style.fn === 'function' ? style.fn(raw) : (style.transform ? style.transform(raw) : raw);
      const line = document.createElement('div');
      line.className = 'line';

      const left = document.createElement('div');
      left.className = 'text';
      left.innerText = transformed;

      const rightWrap = document.createElement('div');
      rightWrap.style.display = 'flex';
      rightWrap.style.alignItems = 'center';
      rightWrap.style.gap = '8px';

      const styleLabel = document.createElement('div');
      styleLabel.className = 'badge';
      styleLabel.innerText = style.name || 'style';
      styleLabel.title = style.name || '';

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerText = 'Copy';
      btn.addEventListener('click', () => {
        // copy the transformed unicode text
        navigator.clipboard.writeText(transformed).then(()=> {
          const prev = btn.innerText;
          btn.innerText = 'Copied!';
          setTimeout(()=> btn.innerText = prev, 1200);
        }).catch(()=> {
          // fallback
          alert('Copy failed — please long-press and copy manually.');
        });
      });

      rightWrap.appendChild(styleLabel);
      rightWrap.appendChild(btn);

      line.appendChild(left);
      line.appendChild(rightWrap);
      preview.appendChild(line);
    } catch(e) {
      console.error('style error', style.name, e);
    }
  });

  // Scroll to top of preview for mobile convenience
  preview.scrollTop = 0;
}

// event listeners
input.addEventListener('input', renderAll);
copyAllBtn.addEventListener('click', ()=>{
  // collect all lines and copy newline separated
  const texts = Array.from(preview.querySelectorAll('.text')).map(el => el.innerText).join('\n');
  if(!texts) return;
  navigator.clipboard.writeText(texts).then(()=> {
    const prev = copyAllBtn.innerText;
    copyAllBtn.innerText = 'Copied!';
    setTimeout(()=> copyAllBtn.innerText = prev, 1500);
  });
});
resetBtn.addEventListener('click', ()=>{
  input.value = '';
  preview.innerHTML = '';
  input.focus();
});
