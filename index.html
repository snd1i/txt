<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Text Wizard ✨</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Pacifico&display=swap');

body {
    font-family: 'Poppins', sans-serif;
    background: #f3f4f6;
}

.text-shadow {
    text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
}

.fancy-preview {
    min-height: 100px;
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}

.fade-in {
    animation: fadeIn 0.5s;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity:1;}
}

button {
    transition: all 0.3s ease;
}
</style>
</head>
<body class="min-h-screen flex flex-col items-center p-6">

<header class="text-center mb-10">
    <h1 class="text-5xl font-bold text-purple-600 text-shadow mb-3">Fancy Text Wizard ✨</h1>
    <p class="text-gray-600 max-w-md mx-auto">Turn your plain text into stylish, magical fonts in one click!</p>
</header>

<div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-3xl">
    <!-- Input -->
    <div class="mb-6">
        <label class="font-semibold text-gray-700 mb-2 block">Enter Your Text</label>
        <textarea id="inputText" rows="4" class="w-full p-4 border rounded-lg focus:ring-2 focus:ring-purple-400" placeholder="Type your magical text..."></textarea>
    </div>

    <!-- Styles -->
    <div class="mb-6">
        <label class="font-semibold text-gray-700 mb-2 block">Choose Style</label>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <button onclick="applyStyle('bold')" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-lg py-2 hover:scale-105">Bold</button>
            <button onclick="applyStyle('italic')" class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-lg py-2 hover:scale-105">Italic</button>
            <button onclick="applyStyle('underline')" class="bg-gradient-to-r from-green-400 to-teal-500 text-white rounded-lg py-2 hover:scale-105">Underline</button>
            <button onclick="applyStyle('strikethrough')" class="bg-gradient-to-r from-red-400 to-pink-500 text-white rounded-lg py-2 hover:scale-105">Strikethrough</button>
            <button onclick="applyStyle('smallcaps')" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white rounded-lg py-2 hover:scale-105">Small Caps</button>
            <button onclick="applyStyle('reverse')" class="bg-gradient-to-r from-gray-400 to-gray-600 text-white rounded-lg py-2 hover:scale-105">Reverse</button>
            <button onclick="applyStyle('fancyFont')" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-lg py-2 hover:scale-105">Pacifico</button>
        </div>
    </div>

    <!-- Preview -->
    <div class="mb-6">
        <label class="font-semibold text-gray-700 mb-2 block">Preview</label>
        <div id="preview" class="fancy-preview text-gray-500 italic fade-in">
            Your fancy text will appear here...
        </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-between">
        <button onclick="copyToClipboard()" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 flex items-center">
            <i data-feather="copy" class="mr-2"></i> Copy
        </button>
        <button onclick="resetAll()" class="bg-gray-300 px-6 py-2 rounded-lg hover:bg-gray-400 flex items-center">
            <i data-feather="refresh-cw" class="mr-2"></i> Reset
        </button>
    </div>
</div>

<script>
feather.replace();

function applyStyle(styleType) {
    const inputText = document.getElementById('inputText').value;
    const preview = document.getElementById('preview');
    if(!inputText){
        preview.innerHTML = '<span class="text-gray-400 italic">Please enter some text first!</span>';
        return;
    }
    let transformed = inputText;
    switch(styleType){
        case 'bold': transformed = `<strong>${inputText}</strong>`; break;
        case 'italic': transformed = `<em>${inputText}</em>`; break;
        case 'underline': transformed = `<u>${inputText}</u>`; break;
        case 'strikethrough': transformed = `<s>${inputText}</s>`; break;
        case 'smallcaps': transformed = inputText.toUpperCase(); break;
        case 'reverse': transformed = inputText.split('').reverse().join(''); break;
        case 'fancyFont': transformed = `<span style="font-family: 'Pacifico', cursive; font-size: 1.5rem;">${inputText}</span>`; break;
        default: transformed = inputText;
    }
    preview.innerHTML = transformed;
}

function copyToClipboard(){
    const preview = document.getElementById('preview');
    const text = preview.innerText || preview.textContent;
    navigator.clipboard.writeText(text);
    alert("Text copied to clipboard!");
}

function resetAll(){
    document.getElementById('inputText').value = '';
    document.getElementById('preview').innerHTML = 'Your fancy text will appear here...';
}
</script>

</body>
</html>
