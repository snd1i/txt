<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>بو گهورینا نافان — Kamiran</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root{
    --accent:#ff4da6;
    --muted:#9ca3af;
    --panel:#0f0f10;
    --panel-2:#121214;
  }
  html,body{
    height:100%;
    background:#000;
    color:#fff;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .container{max-width:980px;margin:28px auto;padding:18px;}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); border-radius:12px; padding:18px;}
  .headerRow{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .title {font-weight:800; font-size:20px; display:flex; align-items:center; gap:12px;}
  textarea{
    width:100%; min-height:70px; resize:vertical;
    background:var(--panel); color:#fff; border-radius:10px; border:1px solid rgba(255,255,255,0.03);
    padding:14px; font-size:16px; outline:none;
  }
  textarea::placeholder{color:#6b7280;}
  .preview {margin-top:14px; max-height:58vh; overflow:auto; padding-right:6px;}
  .line {
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; background:var(--panel-2); border-radius:10px; padding:10px 12px; margin-bottom:10px;
    transition:transform .12s ease, background .12s ease;
    border:1px solid rgba(255,255,255,0.02);
  }
  .line:hover{transform:translateY(-4px); background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));}
  .line .text{font-size:18px; word-break:break-word; flex:1; padding-right:10px; color:#fff;}
  .badge{font-size:12px; color:var(--muted); padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,0.03); background:transparent;}
  .copy-btn{background:var(--accent); color:#fff; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; font-weight:700;}
  .copy-btn:active{transform:scale(.98);}
  .snap-btn{
    display:inline-flex; gap:8px; align-items:center; background:linear-gradient(90deg,#ff6aa6,#ff4da6);
    color:#fff; padding:10px 14px; border-radius:10px; font-weight:700; text-decoration:none;
    box-shadow:0 6px 20px rgba(255,77,166,0.12); border:1px solid rgba(255,77,166,0.12);
    /* SNAPCHAT BUTON İYİLEŞTİRMESİ */
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .snap-btn:hover {
    transform: scale(1.03); /* Hafif büyüt */
    box-shadow:0 8px 25px rgba(255,77,166,0.20); /* Gölgeyi artır */
  }
  .snap-btn:active{
    transform: scale(0.98); /* Tıklama efekti */
  }
  /* BUTONLAR KALDIRILDIĞI İÇİN YATAYDA ORTALAMA */
  .meta-row{display:flex; align-items:center; justify-content:center; gap:12px; margin-top:12px; flex-wrap:wrap;}
  @media (max-width:640px){
    .title{font-size:16px;}
    .line .text{font-size:16px;}
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="headerRow">
        <div>
          <div class="title">
            🖋️🎊 بو گهورینا نافان ب جوانترین شێواز
          </div>
        </div>

                <div style="display:flex; gap:8px;">
          <a id="snapLinkTop" class="snap-btn" href="https://www.snapchat.com/add/k4miran.sndi?share_id=az_iUCJeD3I&locale=tr-TR" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.88 13.36c.04.33.06.67.06 1.02 0 5.52-4.48 10-10 10S1 19.9 1 14.38C1 8.86 5.48 4.38 11 4.38c.35 0 .69.02 1.02.06l.84.13.13-.84C13.41 2.72 14.67 2 16.06 2 19.87 2 23 5.13 23 8.94c0 1.39-.72 2.65-1.92 3.42l-.2.13z"></path></svg>
            add me on Snapchat 👻
          </a>
        </div>
      </div>

      <div style="margin-top:12px;">
        <textarea id="inputText" placeholder="نافێ خو ل فێرێ بنفیسە"></textarea>
      </div>

            <div class="meta-row" style="margin-top:12px;">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center;">
          <span class="badge">Many fancy unicode styles</span>
          <span class="badge">Copy any single style</span>
        </div>
      </div>

      <div id="preview" class="preview" aria-live="polite" aria-atomic="true"></div>

    </div>
  </div>

<script>
// ---------- Utility & reliable mappings ----------

// basic alphabets
const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lower = "abcdefghijklmnopqrstuvwxyz";
const digits = "0123456789";

// helper to create map from two strings of same length
function makeMap(fromStr, toStr){
  const map = {};
  for(let i=0;i<fromStr.length && i<toStr.length;i++){
    map[fromStr[i]] = toStr[i];
  }
  return map;
}

const safeBoldUpper = "𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭";
const safeBoldLower = "𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘷𝘄𝘅𝘆𝘇";
const bold = makeMap(upper + lower, safeBoldUpper + safeBoldLower);

// italic
const italic = makeMap(upper + lower,
  "𝐴𝐵𝐶𝐷𝐸𝐹𝐺𝐻𝐼𝐽𝐾𝐿𝑀𝑁𝑂𝑃𝑄𝑅𝑆𝑇𝑈𝑉𝑊𝑋𝑌𝑍" + 
  "𝑎𝑏𝑐𝑑𝑒𝑓𝑔ℎ𝑖𝑗𝑘𝑙𝑚𝑛𝑜𝑝𝑞𝑟𝑠𝑡𝑢𝑣𝑤𝑥𝑦𝑧"
);

// script
const scriptMap = makeMap(upper + lower,
  "𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒥𝒦ℒ𝑀𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵" +
  "𝒶𝒷𝒸𝒹ℯ𝒻𝑔𝒽𝒾𝒿𝓀𝓁𝓂𝓃ℴ𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏"
);

// fraktur
const frakturMap = makeMap(upper + lower,
  "𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜS𝔗𝔘𝔙𝔚𝔛𝔜𝔝" +
  "𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷"
);

// bold script
const boldScriptMap = makeMap(upper + lower,
  "𝓐𝓑𝓒𝓓𝓔𝓕𝓖𝓗𝓘𝓙𝓚𝓛𝓜𝓝𝓞𝓟𝓠𝓡𝓢𝓣𝓤𝓥𝓦𝓧𝓨𝓩" +
  "𝓪𝓫𝓬𝓭𝓮𝓯𝓰𝓱𝓲𝓳𝓴𝓵𝓶𝓷𝓸𝓹𝓺𝓻𝓼𝓽𝓾𝓿𝔀𝔁𝔂𝔃"
);

// monospace
const monoMap = makeMap(upper + lower,
  "𝙰𝙱𝙲𝙳𝙴𝙵𝙶𝙷𝙸𝙹𝙺𝙻𝙼𝙽𝙾𝙿𝚀𝚁𝚂𝚃𝚄𝚅𝚆𝚇𝚈𝚉" +
  "𝚊𝚋𝚌𝚍𝚎𝚏𝚐𝚑𝚒𝚓𝚔𝚕𝚖𝚗𝚘𝚙𝚚𝚛𝚜𝚝𝚞𝚟𝚠𝚡𝚢𝚣"
);

// fullwidth
const fullwidthMap = makeMap(upper + lower + digits,
  "ＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵＶＷＸＹＺ" +
  "ａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ" +
  "０１２３４５６７８９"
);

// circled
const circledMap = (function(){
  const map = {};
  for(let i=0;i<26;i++){ map[ upper[i] ] = String.fromCharCode(0x24B6 + i); }
  for(let i=0;i<26;i++){ map[ lower[i] ] = String.fromCharCode(0x24D0 + i); }
  return map;
})();

// boxed
const boxedMap = (function(){
  const map = {};
  const boxed = ['🄰','🄱','🄲','🄳','🄴','🄵','🄶','🄷','🄸','🄹','🄺','🄻','🄼','🄽','🄾','🄿','🅀','🅁','🅂','🅃','🅄','🅅','🅆','🅇','🅈','🅉'];
  for(let i=0;i<26;i++){ map[ upper[i] ] = boxed[i]; map[ lower[i] ] = boxed[i]; }
  return map;
})();

// bubble
const bubbleMap = makeMap(upper + lower,
  "ⒶⒷⒸⒹⒺⒻⒼⒽⒾⒿⓀⓁⓂⓃⓄⓅⓆⓇⓈⓉⓊⓋⓌⓍⓎⓏ" +
  "ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛⓜⓝⓞⓟⓠⓡⓢⓣⓤⓥⓦⓧⓨⓩ"
);

// smallcaps
const smallCapsMap = makeMap(lower,
  "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
);

// subscript
const subMap = makeMap(
  "aehijklmnoprstuvx" + "0123456789",
  "ₐₑₕᵢⱼₖₗₘₙₒₚᵣₛₜᵤᵥₓ" + "₀₁₂₃₄₅₆₇₈₉"
);

// *** YENİ: Gerçek Doublestruck haritası eklendi ***
const doubleStruckMap = makeMap(upper + lower + digits,
  "𝔸𝔹ℂ𝔻𝔼𝔽𝔾ℍ𝕀𝕁𝕂𝕃𝕄ℕ𝕆ℙℚℝ𝕊𝕋𝕌𝕍𝕎𝕏𝕐ℤ" +
  "𝕒𝕓𝕔𝕕𝕖𝕗𝕘𝕙𝕚𝕛𝕜𝕝𝕞𝕟𝕠𝕡𝕢𝕣𝕤𝕥𝕦𝕧𝕨𝕩𝕪𝕫" +
  "𝟘𝟙𝟚𝟛𝟜𝟝𝟞𝟟𝟠𝟡"
);

// enclosed bracket style
function enclosedBoxes(s){
  return s.split('').map(c => `【${c}】`).join('');
}

// circled style
function circledStyle(s){
  return s.split('').map(ch => (circledMap[ch] || circledMap[ch.toLowerCase()] || ch)).join('');
}

// helper to apply a map
function applyMap(text, map){
  return text.split('').map(ch => (map[ch] !== undefined ? map[ch] : (map[ch.toUpperCase()] !== undefined ? map[ch.toUpperCase()] : ch))).join('');
}

// --- STİL LİSTESİ GÜNCELLENDİ (Daha şık ve profesyonel stiller) ---
const styleGenerators = [
  {name:'𝐁𝐨𝐥𝐝', fn: t => applyMap(t, bold)},
  {name:'𝘪𝘵𝘢𝘭𝘪𝘤', fn: t => applyMap(t, italic)},
  {name:'𝒮𝒸𝓇𝒾𝓅𝓉', fn: t => applyMap(t, scriptMap)},
  {name:'𝓑𝓸𝓵𝓭-𝓢𝓬𝓻𝓲𝓹𝓽', fn: t => applyMap(t, boldScriptMap)},
  {name:'𝔉𝔯𝔞𝔨𝔱𝔲𝔯', fn: t => applyMap(t, frakturMap)},
  {name:'𝔻𝕠𝕦𝕓𝕝𝕖-struck', fn: t => applyMap(t, doubleStruckMap)}, // Düzeltildi
  {name:'𝙼𝚘𝚗𝚘', fn: t => applyMap(t, monoMap)},
  {name:'ＦＵＬＬＷＩＤＴＨ', fn: t => applyMap(t, fullwidthMap)},
  {name:'ⒸⒾⓇⒸⓁⒺⒹ', fn: t => circledStyle(t)},
  {name:'🄱🅾🅇🄴🄳', fn: t => applyMap(t, boxedMap)},
  {name:'ⒷⓤⒷⒷⓁⒺ', fn: t => applyMap(t, bubbleMap)},
  {name:'sᴍᴀʟʟ ᴄᴀᴘs', fn: t => applyMap(t, smallCapsMap)},
  {name:'ˢᵘᵖᵉʳˢᶜʳᶦᵖᵗ', fn: t => {
      const map = makeMap("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
      "ᵃᵇᶜᵈᵉᶠᵍʰᶦʲᵏˡᵐⁿᵒᵖᵠʳˢᵗᵘᵛʷˣʸᶻᴬᴮᶜᴰᴱᶠᴳᴴᴵᴶᴷᴸᴹᴺᴼᴾᵠᴿˢᵀᵁᵛᵂˣʸᶻ⁰¹²³⁴⁵⁶⁷⁸⁹");
      return applyMap(t, map);
    }},
  {name:'ₛᵤ𝚋ₛ𝚌ʳᶦᵖᵗ', fn: t => applyMap(t, subMap)},
  {name:'【Ｂｏｘｅｄ】', fn: t => enclosedBoxes(t)},
  {name:'A r a l ı k l ı', fn: t => t.split('').join(' ')}, // Güncellendi
  {name:'N o k t a l ı', fn: t => t.split('').map(c=>c).join('·')}, // Güncellendi
  {name:'K⃣-style (numbers only)', fn: t => t.split('').map(c => (digits.includes(c) ? c + '\u20E3' : c)).join('')},
  {name:'UPPER-FULLWIDTH', fn: t => applyMap(t, fullwidthMap)},
  {name:'Üsᴛü Çiᴢiʟi', fn: t => t.split('').map(c=> c + '\u0336').join('')}, // Güncellendi
  {name:'Aʟᴛı Çiᴢiʟi', fn: t => t.split('').map(c=> c + '\u0332').join('')}, // Güncellendi
  {name:'Çiғᴛ Aʟᴛ Çiᴢiʟi', fn: t => t.split('').map(c=> c + '\u0333').join('')}, // YENİ
  {name:'Dᴀʟɢᴀʟı Çiᴢɢi', fn: t => t.split('').map(c=> c + '\u0330').join('')}, // YENİ
  {name:'small-lowercase', fn: t => t.toLowerCase()},
  
  // --- Zalgo, Flip, Framed, Emoji Frame gibi stiller kaldırıldı ---
];

// ---------- Rendering & behavior ----------
const input = document.getElementById('inputText');
const preview = document.getElementById('preview');
// --- Kaldırılan butonların değişkenleri silindi ---

function renderAll(){
  const raw = input.value || '';
  preview.innerHTML = '';
  if(!raw.trim()) return;

  styleGenerators.forEach(style => {
    try {
      const transformed = (typeof style.fn === 'function') ? style.fn(raw) : raw;
      const line = document.createElement('div');
      line.className = 'line';

      const left = document.createElement('div');
      left.className = 'text';
      left.innerText = transformed;

      const rightWrap = document.createElement('div');
      rightWrap.style.display = 'flex';
      rightWrap.style.alignItems = 'center';
      rightWrap.style.gap = '8px';

      const styleLabel = document.createElement('div');
      styleLabel.className = 'badge';
      styleLabel.innerText = style.name || 'style';
      styleLabel.title = style.name || '';

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerText = 'Copy';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(transformed).then(()=> {
          const prev = btn.innerText;
          btn.innerText = 'Copied!';
          setTimeout(()=> btn.innerText = prev, 1200);
        }).catch(()=> {
          alert('Copy failed — please long-press and copy manually.');
        });
      });

      rightWrap.appendChild(styleLabel);
      rightWrap.appendChild(btn);

      line.appendChild(left);
      line.appendChild(rightWrap);
      preview.appendChild(line);
    } catch(e){
      console.error('style error', style.name, e);
    }
  });

  preview.scrollTop = 0;
}

input.addEventListener('input', renderAll);

// --- Kaldırılan butonların 'event listener'ları silindi ---

// focus input on load
input.focus();
</script>
</body>
</html>
