<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Name Maker</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@300;400;500;700&display=swap');

body {
    font-family: 'Roboto', sans-serif;
    background-color: #000;
    color: #fff;
}
.header-title {
    font-family: 'Pacifico', cursive;
    font-size: 2.5rem;
    text-align: center;
    margin-bottom: 0.5rem;
    color: #ff69b4;
}
.snap-btn {
    display: block;
    width: 220px;
    margin: 0 auto 2rem auto;
    text-align: center;
    background: linear-gradient(90deg, #fffc00, #ff00ff);
    color: #000;
    font-weight: bold;
    padding: 0.7rem 1rem;
    border-radius: 12px;
    text-decoration: none;
    transition: transform 0.2s ease;
}
.snap-btn:hover {
    transform: scale(1.05);
}
textarea {
    width: 100%;
    padding: 1rem;
    border-radius: 12px;
    border: none;
    font-size: 1.2rem;
    margin-bottom: 2rem;
}
.font-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 1rem;
    margin-bottom: 0.5rem;
    border-radius: 8px;
    background: #111;
    transition: background 0.2s;
}
.font-item:hover {
    background: #222;
}
.copy-btn {
    background: #ff69b4;
    color: #000;
    font-weight: bold;
    border: none;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
}
.copy-btn:hover {
    background: #ff1493;
}
</style>
</head>
<body class="min-h-screen px-4 py-8">

<h1 class="header-title">🖋️🎊 Fancy Name Maker</h1>

<a href="https://www.snapchat.com/add/k4miran.sndi?share_id=az_iUCJeD3I&locale=tr-TR" target="_blank" class="snap-btn">Add me on Snapchat 👻</a>

<textarea id="nameInput" placeholder="Type your name"></textarea>
<div id="fontsList"></div>

<script>
const fontsList = document.getElementById('fontsList');
const input = document.getElementById('nameInput');

// Fancy font alfabeleri
const styles = [
"𐌀𐌁𐌂𐌃𐌄𐌅Ᏽ𐋅𐌉Ꮭ𐌊𐌋𐌌𐌍Ꝋ𐌐𐌒𐌓𐌔𐌕𐌵ᕓᏔ𐋄𐌙Ɀ",
"ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖqʳˢᵗᵘᵛʷˣʸᶻ",
"ₐbcdₑfgₕᵢⱼₖₗₘₙₒₚqᵣₛₜᵤᵥwₓyz",
"ᏗᏰፈᎴᏋᎦᎶᏂᎥᏠᏦᏝᎷᏁᎧᎮᎤᏒᏕᏖᏬᏉᏇጀᎩፚ",
"♥a♥b♥c♥d♥e♥f♥g♥h♥i♥j♥k♥l♥m♥n♥o♥p♥q♥r♥s♥t♥u♥v♥w♥x♥y♥z♥",
"⒜⒝⒞⒟⒠⒡⒢⒣⒤⒥⒦⒧⒨⒩⒪⒫⒬⒭⒮⒯⒰⒱⒲⒳⒴⒵",
"𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷",
"ᗩᗷᑕᗪᗴᖴǤᕼᎥᒎᛕᒪᗰᑎᗝᑭɊᖇᔕ丅ᑌᐯᗯ᙭Ƴ乙",
"𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳",
"ꋬꃳꉔ꒯ꏂꊰꍌꁝ꒐꒻ꀘ꒒ꂵꋊꄲꉣꆰꋪꇙ꓄꒤꒦ꅐꉧꌦꁴ",
"คც८ძ૯Բ૭ҺɿʆқՆɱՈ૦ƿҩՐς੮υ౮ω૪עઽ",
"𝐚𝐛ςĐᵉ𝔣ⓖħ𝕚ᒎ𝓚ŁⓂ𝐍ό𝐩ợŘⓈ𝐓𝐔ᐯ𝐰𝕩ү𝔷"
];

function applyStyle(name, style) {
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
    let result = '';
    for(let i = 0; i < name.length; i++) {
        const c = name[i];
        const index = alphabet.indexOf(c);
        if(index !== -1){
            result += style[index % style.length];
        } else {
            result += c; // Latin olmayan karakterler olduğu gibi kalacak
        }
    }
    return result;
}

function renderFonts() {
    const name = input.value || "";
    fontsList.innerHTML = '';
    styles.forEach(style => {
        const div = document.createElement('div');
        div.className = 'font-item';
        const span = document.createElement('span');
        span.textContent = applyStyle(name, style);
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = () => {
            navigator.clipboard.writeText(span.textContent);
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 1000);
        };
        div.appendChild(span);
        div.appendChild(btn);
        fontsList.appendChild(div);
    });
}

input.addEventListener('input', renderFonts);
renderFonts();
</script>

</body>
</html>
