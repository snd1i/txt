<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Text Generator ✨</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>

<!-- Google Fonts (karmaşık ve modern fontlar) -->
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron&family=Press+Start+2P&family=Righteous&family=Unica+One&family=Special+Elite&family=Black+Ops+One&family=Bungee+Inline&family=Bungee+Shade&family=Sigmar+One&family=Ewert&family=Nosifer&family=Rock+Salt&family=Fugaz+One&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Monoton', sans-serif;
    background: #0f0f0f;
    color: #fff;
    padding: 20px;
}

textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 1.2rem;
    background: #1a1a1a;
    color: #fff;
}

textarea::placeholder {
    color: #aaa;
}

.fancy-preview {
    margin-top: 20px;
}

.fancy-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 10px;
    background: #1a1a1a;
    font-size: 1.5rem;
    transition: all 0.3s ease;
}

.fancy-line:hover {
    background: #2a2a2a;
}

.copy-btn {
    background: #ff4081;
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
    margin-left: 10px;
    flex-shrink: 0;
    transition: all 0.3s ease;
}

.copy-btn:hover {
    background: #e73370;
}
</style>
</head>
<body>

<header class="text-center mb-6">
<h1 class="text-4xl font-bold text-pink-500 mb-2">Fancy Text Generator ✨</h1>
<p class="text-gray-400">Type your text and see it in 15+ crazy modern fonts!</p>
</header>

<!-- Input -->
<textarea id="inputText" rows="3" placeholder="Type your text here..."></textarea>

<!-- Preview -->
<div id="preview" class="fancy-preview"></div>

<script>
feather.replace();

// Modern/karmaşık fontlar
const fonts = [
    'Monoton','Orbitron','Press Start 2P','Righteous','Unica One','Special Elite',
    'Black Ops One','Bungee Inline','Bungee Shade','Sigmar One','Ewert','Nosifer',
    'Rock Salt','Fugaz One'
];

const input = document.getElementById('inputText');
const preview = document.getElementById('preview');

// Her fontta satır oluştur
input.addEventListener('input', () => {
    const text = input.value.trim();
    preview.innerHTML = '';
    if(!text) return;

    fonts.forEach(font => {
        const line = document.createElement('div');
        line.className = 'fancy-line';
        line.style.fontFamily = font;

        const span = document.createElement('span');
        span.innerText = text;

        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerText = 'Copy';
        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(text);
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'Copy', 1500);
        });

        line.appendChild(span);
        line.appendChild(btn);
        preview.appendChild(line);
    });
});
</script>

</body>
</html>
