<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Name & Number Maker</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@300;400;500;700&display=swap');

body {
    font-family: 'Roboto', sans-serif;
    background-color: #000;
    color: #fff;
}
.header-title {
    font-family: 'Pacifico', cursive;
    font-size: 2.5rem;
    text-align: center;
    margin-bottom: 0.5rem;
    color: #ff69b4;
}
.snap-btn {
    display: block;
    width: 220px;
    margin: 0 auto 2rem auto;
    text-align: center;
    background: linear-gradient(90deg, #fffc00, #ff00ff);
    color: #000;
    font-weight: bold;
    padding: 0.7rem 1rem;
    border-radius: 12px;
    text-decoration: none;
    transition: transform 0.2s ease;
}
.snap-btn:hover {
    transform: scale(1.05);
}
textarea {
    width: 100%;
    padding: 1rem;
    border-radius: 12px;
    border: none;
    font-size: 1.2rem;
    margin-bottom: 2rem;
    color: #000;
    background-color: #fff;
}
.font-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 1rem;
    margin-bottom: 0.5rem;
    border-radius: 8px;
    background: #111;
    transition: background 0.2s;
}
.font-item:hover {
    background: #222;
}
.copy-btn {
    background: #ff69b4;
    color: #000;
    font-weight: bold;
    border: none;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
}
.copy-btn:hover {
    background: #ff1493;
}
</style>
</head>
<body class="min-h-screen px-4 py-8">

<h1 class="header-title">🖋️🎊 Fancy Name & Number Maker</h1>

<a href="https://www.snapchat.com/add/k4miran.sndi?share_id=az_iUCJeD3I&locale=tr-TR" target="_blank" class="snap-btn">Add me on Snapchat 👻</a>

<textarea id="nameInput" placeholder="Type your name or numbers"></textarea>
<div id="fontsList"></div>

const input = document.getElementById('nameInput');

"a̷b̷c̷d̷e̷f̷g̷h̷i̷j̷k̷l̷m̷n̷o̷p̷q̷r̷s̷t̷u̷v̷w̷x̷y̷z̷0123456789",

"ā̤̓̍͘b̬͖̏́͢c͕͗ͤ̕̕ḑ̴̞͛̒ẹ̿͋̒̕f̵͖̜̉ͅĝ̽̓̀͑ḣ̖̻͛̓ỉ͔͖̜͌j̪̟̮̔ͩḳ̯͍̑ͦl̙͖̑̾ͣḿ̬̏ͤͅṇ̤͛̒̍o̯̱̊͊͢p̞̈͑̚͞q͉ͬ͋̇ͥr̴̨̦͕̝s̠҉͍͊ͅt̲̂̓ͩ̑ư̡͕̭̇v͒̄ͭ̏̇w̦̺̐̐͟x̛̘̠̹͋y҉̃̀̋̑z̼͙̓́ͭ0123456789",
"ᥲხᥴძᥱƒgɦᎥ᧒ƙᥣꪔꪀ᥆ρqᖇ᥉ƚᥙ᥎᭙ꪎyᤁ0123456789",
"𝖆𝖉𝖈𝖉𝖊𝖋𝖌𝖍𝖎𝖏𝖐𝖗𝖒𝖓𝖔𝖕𝖖𝖗𝖘𝖙𝖚𝒗𝒘𝖝𝒚𝒛0123456789",
"𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ0123456789",

"𝖆𝖇𝖈𝖉𝖊𝖋𝖌𝖍𝖎𝖏𝖐𝖑𝖒𝖓𝖔𝖕𝖖𝖗𝖘𝖙𝖚𝖛𝖜𝖝𝖞𝖟0123456789",
"𝔸𝔹ℂ𝔻𝔼𝔽𝔾ℍ𝕀𝕁𝕂𝕃𝕄ℕ𝕆ℙℚℝ𝕊𝕋𝕌𝕍𝕎𝕏Ýℤ0123456789",
"𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝑳𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙0123456789",
"𝓪𝓫𝓬𝓭𝓮𝓯𝓰𝓱𝓲𝓳𝓴𝓵𝓶𝓷𝓸𝓹𝓺𝓻𝓼𝓽𝓾𝓿𝔀𝔁𝔂𝔃0123456789",

"𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝??𝘟𝘠𝘡0123456789",
"𐌀𐌁𐌂𐌃𐌄𐌅Ᏽ𐋅𐌉Ꮭ𐌊𐌋𐌌𐌍Ꝋ𐌐𐌒𐌓𐌔𐌕𐌵ᕓᏔ𐋄𐌙Ɀ0123456789",
"ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖqʳˢᵗᵘᵛʷˣʸᶻ0123456789",
"ₐbcdₑfgₕᵢⱼₖₗₘₙₒₚqᵣₛₜᵤᵥwₓyz0123456789",
"ᏗᏰፈᎴᏋᎦᎶᏂᎥᏠᏦᏝᎷᏁᎧᎮᎤᏒᏕᏖᏬᏉᏇጀᎩፚ0123456789",
"♥a♥b♥c♥d♥e♥f♥g♥h♥i♥j♥k♥l♥m♥n♥o♥p♥q♥r♥s♥t♥u♥v♥w♥x♥y♥z♥0123456789",
"⒜⒝⒞⒟⒠⒡⒢⒣⒤⒥⒦⒧⒨⒩⒪⒫⒬⒭⒮⒯⒰⒱⒲⒳⒴⒵0123456789",
"𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷0123456789"
];

function applyStyle(name, style) {
    let result = '';
    for (let i = 0; i < name.length; i++) {
        const c = name[i];
        const index = normalChars.indexOf(c);
        if (index !== -1) {
            result += style[index % style.length];
        } else {
            result += c;
        }
    }
    return result;
}

function renderFonts() {
    const name = input.value || "";
    fontsList.innerHTML = '';
    styles.forEach(style => {
        const div = document.createElement('div');
        div.className = 'font-item';
        const span = document.createElement('span');
        span.textContent = applyStyle(name, style);
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = () => {
            navigator.clipboard.writeText(span.textContent);
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 1000);
        };
        div.appendChild(span);
        div.appendChild(btn);
        fontsList.appendChild(div);
    });
}

input.addEventListener('input', renderFonts);
renderFonts();
</script>

</body>
</html>
