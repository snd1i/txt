<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Text Generator ✨</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Lobster&family=Dancing+Script&family=Monoton&family=Montez&family=Orbitron&family=Rubik+Mono+One&family=Raleway&family=Press+Start+2P&family=Amatic+SC&family=Fredoka+One&family=Cinzel+Decorative&family=Great+Vibes&family=Kaushan+Script&family=Shadows+Into+Light&family=Satisfy&family=Varela+Round&family=Patrick+Hand&family=Quicksand&family=Roboto+Slab&family=Josefin+Sans&family=Kalam&family=Caveat&family=Oleo+Script&family=Sacramento&family=Indie+Flower&family=Comfortaa&family=Arizonia&family=Bangers&family=Rock+Salt&family=Orbitron&family=Monoton&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #f3f4f6;
    padding: 20px;
}

textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 1rem;
}

.fancy-preview {
    margin-top: 20px;
}

.fancy-line {
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    background: #fff;
    border: 1px solid #e5e7eb;
    font-size: 1.5rem;
    transition: all 0.3s ease;
}

button {
    transition: all 0.3s;
}

button:hover { transform: scale(1.05); }
</style>
</head>
<body>

<header class="text-center mb-8">
    <h1 class="text-5xl font-bold text-purple-600 mb-2">Fancy Text Generator ✨</h1>
    <p class="text-gray-600">Type your text and see it magically in 30+ modern fonts!</p>
</header>

<!-- Input -->
<textarea id="inputText" rows="3" placeholder="Type your text here..."></textarea>

<!-- Preview -->
<div id="preview" class="fancy-preview"></div>

<!-- Actions -->
<div class="flex justify-start gap-4 mt-4">
    <button onclick="copyToClipboard()" class="bg-purple-600 text-white px-6 py-2 rounded-lg flex items-center">
        <i data-feather="copy" class="mr-2"></i> Copy All
    </button>
    <button onclick="resetAll()" class="bg-gray-300 px-6 py-2 rounded-lg flex items-center">
        <i data-feather="refresh-cw" class="mr-2"></i> Reset
    </button>
</div>

<script>
feather.replace();

const fonts = [
    'Pacifico','Lobster','Dancing Script','Monoton','Montez','Orbitron','Rubik Mono One',
    'Raleway','Press Start 2P','Amatic SC','Fredoka One','Cinzel Decorative','Great Vibes',
    'Kaushan Script','Shadows Into Light','Satisfy','Varela Round','Patrick Hand',
    'Quicksand','Roboto Slab','Josefin Sans','Kalam','Caveat','Oleo Script','Sacramento',
    'Indie Flower','Comfortaa','Arizonia','Bangers','Rock Salt'
];

const input = document.getElementById('inputText');
const preview = document.getElementById('preview');

input.addEventListener('input', () => {
    const text = input.value.trim();
    preview.innerHTML = '';
    if(!text) return;

    fonts.forEach(font => {
        const line = document.createElement('div');
        line.className = 'fancy-line';
        line.style.fontFamily = font;
        line.innerText = text;
        preview.appendChild(line);
    });
});

function copyToClipboard(){
    let allText = '';
    document.querySelectorAll('.fancy-line').forEach(line => {
        allText += line.innerText + '\n';
    });
    navigator.clipboard.writeText(allText);
    alert("All text copied to clipboard!");
}

function resetAll(){
    input.value = '';
    preview.innerHTML = '';
}
</script>

</body>
</html>
